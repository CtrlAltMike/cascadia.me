name: Cascadia site release gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    name: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Field Maps verifier dependencies
        run: python -m pip install -r scripts/field-maps/requirements-phase2.txt

      - name: Test Field Maps catalog decisions
        run: python scripts/field-maps/test_phase2_pipeline.py

      - name: Validate closed-commerce Field Maps pages
        run: python scripts/field-maps/validate-phase5-site-readiness.py

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate Field Maps browser script
        run: node --check js/field-maps.js

      - name: Validate Signals registry
        run: node signals/scripts/validate-registry.mjs
